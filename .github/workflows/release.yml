name: NomaanOS-Core Automated Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-and-publish:
    name: Build, Audit & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Tooling & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit build twine pytest pytest-cov
          pip install -e .

      - name: Run Quality, SAST and Test Gate
        run: |
          ruff check .
          bandit -r src/ -ll
          pytest -v

      - name: Build Distribution Packages
        run: python -m build

      - name: Validate Metadata with Twine
        run: twine check --strict dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
