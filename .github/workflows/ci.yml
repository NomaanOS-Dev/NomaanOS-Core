name: NomaanOS-Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout NomaanOS-Core
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Python Bytecode Compilation Check
      run: |
        python -m py_compile nomaanos.py api_server.py tui_dashboard.py

    - name: Verify CLI Engine Standalone Execution
      run: |
        python nomaanos.py --status
        python nomaanos.py telemetry
        python nomaanos.py chain-verify

    - name: Validate OpenAPI Schema
      run: |
        python -c "import json; openapi = json.load(open('openapi.json')); assert openapi['openapi'] == '3.0.3'"
