name: NomaanOS-Core Security & Integrity CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-sast:
    name: Code Quality & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Tooling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest pytest-cov

      - name: Run Ruff Architecture & Format Linter
        run: ruff check .

      - name: Run Bandit Static Application Security Testing (SAST)
        run: bandit -r src/ -ll

  test-matrix:
    name: Zero-Trust Matrix Verification
    runs-on: ubuntu-latest
    needs: lint-and-sast
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Execute Cryptographic & Security Test Suite
        run: pytest -v

  package-build-audit:
    name: Packaging & Wheel Metadata Verification
    runs-on: ubuntu-latest
    needs: lint-and-sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Build & Validation Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and Wheel Artifacts
        run: python -m build

      - name: Strict Twine Metadata & Distribution Audit
        run: twine check --strict dist/*
