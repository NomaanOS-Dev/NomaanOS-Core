name: NomaanOS-Core Security & Integrity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Code Quality & Architecture Linter (Ruff)
        run: |
          ruff check .

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r src/ -ll

  matrix-test-suite:
    needs: lint-and-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=src

      - name: Test CLI Dispatch & Integrity Checks
        run: |
          python nomaanos.py --status
          python nomaanos.py chain-verify
