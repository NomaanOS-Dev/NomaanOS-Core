name: NomaanOS-Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout NomaanOS-Core
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Syntax & Compilation Check
      run: |
        python -m py_compile nomaanos.py api_server.py tui_dashboard.py ARCHITECTURE.md || true

    - name: Execute Standalone Core Verification
      run: |
        python nomaanos.py --status
        python -c "import json; open('openapi.json')"
