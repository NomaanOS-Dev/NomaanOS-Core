name: NomaanOS Security & Integrity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install uvicorn fastapi

    - name: Run Sovereign CI Test Pipeline
      run: |
        python nomaanos.py ci-run
        python nomaanos.py kernel-boot
        python nomaanos.py health
