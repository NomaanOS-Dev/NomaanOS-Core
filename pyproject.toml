[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomaanos-core"
version = "6.0.0"
description = "Sovereign AI Stack (SAS) - Fail-Closed Execution & Cryptographic Audit Ledger"
readme = "README.md"
authors = [
    { name = "Nomaan Khan", email = "nomaanos@duck.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "bandit",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nomaanos = "nomaanos:main"
