[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomaanos-core"
version = "6.0.0"
description = "Sovereign AI Stack (SAS) - Fail-Closed Execution & Cryptographic Audit Ledger"
readme = "README.md"
authors = [
    { name = "Nomaan Khan", email = "nomaanos@duck.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
requires-python = ">=3.8"

[project.scripts]
nomaanos = "nomaanos:main"
